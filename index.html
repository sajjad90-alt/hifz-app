<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تحفيظ المنهج</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#f0fdfa;color:#134e4a;padding-bottom:env(safe-area-inset-bottom)}
header{background:#0f766e;color:#fff;padding:14px 16px;text-align:center;font-size:20px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{margin:0 0 10px;font-size:16px;color:#0f766e}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;color:#fff;background:#0f766e;width:100%}
.btn.alt{background:#2563eb}.btn.warn{background:#dc2626}.btn.gray{background:#64748b}.btn.gold{background:#d97706}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}
label{display:block;font-size:13px;margin:8px 0 3px;color:#475569}
select,input[type=number],textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}
textarea{min-height:140px;line-height:1.8}
input[type=range]{width:100%}
#prog{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:8px 0;display:none}
#prog div{height:100%;width:0;background:#0f766e;transition:width .2s}
#status{font-size:13px;color:#475569;min-height:18px}
#now{background:#ecfeff;border:2px solid #0f766e;border-radius:14px;padding:16px;font-size:24px;line-height:2;text-align:center;min-height:90px}
#counter{text-align:center;font-weight:700;margin:8px 0;color:#0f766e}
#chunks{max-height:240px;overflow:auto;border:1px solid #e2e8f0;border-radius:10px}
.ch{padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:15px;line-height:1.7}
.ch.on{background:#fef3c7;font-weight:700}
.saved{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.saved span{flex:1;font-size:14px}
.saved button{border:0;border-radius:8px;padding:8px 10px;color:#fff;background:#2563eb}
.saved button.d{background:#dc2626}
small{color:#64748b}
</style>
</head>
<body>
<header>📖 تحفيظ المنهج بالاستماع</header>
<main>

<div class="card">
  <h2>١) صوّر صفحة الكتاب</h2>
  <label>لغة الكتاب</label>
  <select id="lang">
    <option value="ara">عربي</option>
    <option value="eng">English</option>
    <option value="ara+eng">عربي + English</option>
  </select>
  <div class="row" style="margin-top:10px">
    <button class="btn" id="btnCam">📷 تصوير بالكاميرا</button>
    <button class="btn alt" id="btnGal">🖼️ من المعرض</button>
  </div>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileGal" accept="image/*" hidden>
  <div id="prog"><div></div></div>
  <div id="status"></div>
  <small>نصيحة: صوّر الصفحة مستقيمة وبإضاءة جيدة وبدون ظل لتكون القراءة دقيقة.</small>
</div>

<div class="card">
  <h2>٢) النص المستخرج (يمكنك تصحيحه)</h2>
  <textarea id="text" placeholder="سيظهر هنا النص بعد التصوير، أو الصق النص يدويًا..."></textarea>
  <div class="row" style="margin-top:8px">
    <button class="btn gold" id="btnSave">💾 حفظ الصفحة</button>
    <button class="btn gray" id="btnClear">🧹 مسح</button>
  </div>
</div>

<div class="card">
  <h2>٣) الإعدادات</h2>
  <div class="row">
    <div><label>كلمات في المقطع (حد أقصى)</label><input type="number" id="words" min="2" max="30" value="10"></div>
    <div><label>عدد التكرار</label><input type="number" id="reps" min="1" max="50" value="10"></div>
  </div>
  <label>الصمت بين التكرارات: <b id="gapV">1</b> ثانية</label>
  <input type="range" id="gap" min="0" max="6" step="0.5" value="1">
  <label>سرعة القراءة: <b id="rateV">0.9</b></label>
  <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="0.9">
  <label>الصوت العربي</label>
  <select id="vAr"></select>
  <label>الصوت الإنجليزي</label>
  <select id="vEn"></select>
  <small>اختر صوتًا من نوع Google أو Network/Online إن وُجد لأنه الأقرب للبشر.</small>
</div>

<div class="card">
  <h2>٤) التشغيل</h2>
  <div id="now">—</div>
  <div id="counter"></div>
  <div class="row">
    <button class="btn" id="btnPlay">▶️ ابدأ</button>
    <button class="btn warn" id="btnStop">⏹ إيقاف</button>
  </div>
  <div class="row">
    <button class="btn gray" id="btnPrev">⏮ السابق</button>
    <button class="btn gray" id="btnNext">⏭ التالي</button>
  </div>
  <label>المقاطع (اضغط على مقطع للبدء منه)</label>
  <div id="chunks"></div>
</div>

<div class="card">
  <h2>📚 الصفحات المحفوظة</h2>
  <div id="savedList"><small>لا توجد صفحات محفوظة.</small></div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;

/* ---------- تخزين محلي ---------- */
function loadSaved(){ try{ return JSON.parse(localStorage.getItem('hifz_pages')||'[]'); }catch(e){ return []; } }
function storeSaved(a){ try{ localStorage.setItem('hifz_pages', JSON.stringify(a)); }catch(e){ alert('تعذر الحفظ'); } }
function renderSaved(){
  const box=$('savedList'), a=loadSaved();
  box.innerHTML='';
  if(!a.length){ box.innerHTML='<small>لا توجد صفحات محفوظة.</small>'; return; }
  a.forEach(p=>{
    const d=document.createElement('div'); d.className='saved';
    const s=document.createElement('span'); s.textContent=p.title;
    const o=document.createElement('button'); o.textContent='فتح';
    o.onclick=()=>{ $('text').value=p.text; buildChunks(); window.scrollTo({top:0,behavior:'smooth'}); };
    const x=document.createElement('button'); x.textContent='حذف'; x.className='d';
    x.onclick=()=>{ if(confirm('حذف هذه الصفحة؟')){ storeSaved(loadSaved().filter(i=>i.id!==p.id)); renderSaved(); } };
    d.append(s,o,x); box.appendChild(d);
  });
}
$('btnSave').onclick=()=>{
  const t=$('text').value.trim(); if(!t){ alert('لا يوجد نص'); return; }
  const title=prompt('اسم الصفحة (مثال: العلوم - صفحة 25)', t.split(/\s+/).slice(0,4).join(' '));
  if(!title) return;
  const a=loadSaved(); a.unshift({id:Date.now(),title,text:t}); storeSaved(a); renderSaved();
};
$('btnClear').onclick=()=>{ stopAll(); $('text').value=''; chunks=[]; renderChunks(); $('now').textContent='—'; $('counter').textContent=''; };

/* ---------- OCR ---------- */
$('btnCam').onclick=()=>$('fileCam').click();
$('btnGal').onclick=()=>$('fileGal').click();
$('fileCam').onchange=e=>handleFile(e.target.files[0]);
$('fileGal').onchange=e=>handleFile(e.target.files[0]);

function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>rej(new Error('تعذر فتح الصورة'));
    img.src=url;
  });
}
function prepCanvas(img){
  const max=2200; let w=img.naturalWidth, h=img.naturalHeight;
  const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h), p=d.data;
  let lo=255, hi=0;
  for(let i=0;i<p.length;i+=4){ const v=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114); p[i]=p[i+1]=p[i+2]=v; if(v<lo)lo=v; if(v>hi)hi=v; }
  const rg=Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){ const v=(p[i]-lo)*255/rg; p[i]=p[i+1]=p[i+2]=v; }
  g.putImageData(d,0,0);
  return c;
}
async function handleFile(file){
  if(!file) return;
  stopAll();
  const prog=$('prog'), bar=prog.firstElementChild, st=$('status');
  prog.style.display='block'; bar.style.width='2%'; st.textContent='جاري تجهيز الصورة...';
  try{
    if(typeof Tesseract==='undefined') throw new Error('مكتبة القراءة لم تُحمَّل. تأكد من الاتصال بالإنترنت ثم أعد فتح التطبيق.');
    const img=await loadImage(file);
    const canvas=prepCanvas(img);
    const r=await Tesseract.recognize(canvas,$('lang').value,{
      logger:m=>{
        if(m.status==='recognizing text'){ bar.style.width=(10+m.progress*90)+'%'; st.textContent='جاري قراءة النص... '+Math.round(m.progress*100)+'%'; }
        else { st.textContent='تحميل بيانات اللغة (أول مرة فقط)...'; }
      }
    });
    $('text').value=(r.data.text||'').trim();
    st.textContent=$('text').value?'تمت القراءة ✅ راجع النص وصحح الأخطاء ثم اضغط ابدأ.':'لم يُستخرج نص. جرّب صورة أوضح.';
    buildChunks();
  }catch(err){
    st.textContent='خطأ: '+err.message;
  }finally{
    setTimeout(()=>{prog.style.display='none';},800);
    $('fileCam').value=''; $('fileGal').value='';
  }
}

/* ---------- التقطيع ---------- */
let chunks=[], idx=0, rep=0, playing=false, timer=null, token=0, curUtter=null, wake=null;

function makeChunks(text,n){
  const t=text.replace(/\r/g,'').replace(/\n\s*\n/g,'\u0001').replace(/\n/g,' ').replace(/[ \t]+/g,' ');
  const segs=t.split(/\u0001|(?<=[.،,;؛:؟?!…])\s+/).map(s=>s.trim()).filter(Boolean);
  const pieces=[];
  segs.forEach(s=>{
    const w=s.split(/\s+/).filter(Boolean);
    if(w.length<=n){ pieces.push(w); return; }
    const k=Math.ceil(w.length/n), size=Math.ceil(w.length/k);
    for(let i=0;i<w.length;i+=size) pieces.push(w.slice(i,i+size));
  });
  const out=[]; let acc=[];
  pieces.forEach(p=>{
    if(acc.length && acc.length+p.length>n){ out.push(acc.join(' ')); acc=[]; }
    acc=acc.concat(p);
  });
  if(acc.length) out.push(acc.join(' '));
  return out;
}
function buildChunks(){
  const n=Math.max(2,parseInt($('words').value)||10);
  chunks=makeChunks($('text').value,n); idx=0; rep=0; renderChunks(); updateUI();
}
function renderChunks(){
  const box=$('chunks'); box.innerHTML='';
  chunks.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='ch'+(i===idx?' on':'');
    d.textContent=(i+1)+'. '+c;
    d.onclick=()=>{ const was=playing; stopAll(); idx=i; rep=0; updateUI(); if(was||true) startPlay(); };
    box.appendChild(d);
  });
}
function updateUI(){
  $('now').textContent=chunks[idx]||'—';
  $('counter').textContent=chunks.length?('المقطع '+(idx+1)+' من '+chunks.length+' — التكرار '+Math.min(rep+(playing?1:0),+$('reps').value)+' من '+$('reps').value):'';
  [...$('chunks').children].forEach((el,i)=>{ el.classList.toggle('on',i===idx); if(i===idx&&playing) el.scrollIntoView({block:'nearest'}); });
  $('btnPlay').textContent=playing?'⏸ إيقاف مؤقت':'▶️ ابدأ';
}
$('text').addEventListener('change',()=>{ stopAll(); buildChunks(); });
$('words').addEventListener('change',()=>{ stopAll(); buildChunks(); });
$('reps').addEventListener('change',updateUI);
$('gap').oninput=()=>$('gapV').textContent=$('gap').value;
$('rate').oninput=()=>$('rateV').textContent=$('rate').value;

/* ---------- الأصوات ---------- */
let voices=[];
function loadVoices(){
  voices=synth.getVoices();
  fill($('vAr'),voices.filter(v=>/^ar/i.test(v.lang)),'ar');
  fill($('vEn'),voices.filter(v=>/^en/i.test(v.lang)),'en');
}
function fill(sel,list,key){
  const prev=sel.value; sel.innerHTML='';
  if(!list.length){ const o=document.createElement('option'); o.value=''; o.textContent='(الصوت الافتراضي للجهاز)'; sel.appendChild(o); return; }
  list.sort((a,b)=>(/google|network|online|natural/i.test(b.name)?1:0)-(/google|network|online|natural/i.test(a.name)?1:0));
  list.forEach(v=>{ const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=v.name+' ('+v.lang+')'; sel.appendChild(o); });
  const saved=localStorage.getItem('voice_'+key); if(saved&&[...sel.options].some(o=>o.value===saved)) sel.value=saved; else if(prev) sel.value=prev;
}
$('vAr').onchange=()=>localStorage.setItem('voice_ar',$('vAr').value);
$('vEn').onchange=()=>localStorage.setItem('voice_en',$('vEn').value);
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }

/* ---------- التشغيل ---------- */
function speak(text,done){
  const isAr=/[\u0600-\u06FF]/.test(text);
  const u=new SpeechSynthesisUtterance(text);
  const uri=(isAr?$('vAr'):$('vEn')).value;
  const v=voices.find(x=>x.voiceURI===uri);
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang=isAr?'ar-SA':'en-US';
  u.rate=parseFloat($('rate').value);
  let fired=false; const fin=()=>{ if(fired) return; fired=true; clearInterval(keep); done(); };
  u.onend=fin; u.onerror=fin;
  curUtter=u; // منع حذف الكائن من الذاكرة
  synth.speak(u);
  // حل لمشكلة توقف كروم أندرويد في النصوص الطويلة
  const keep=setInterval(()=>{ if(!synth.speaking){ fin(); } },700);
}
function playChunk(){
  if(!playing) return;
  if(idx>=chunks.length){ finish(); return; }
  const my=++token; updateUI();
  speak(chunks[idx],()=>{
    if(my!==token||!playing) return;
    rep++;
    const reps=Math.max(1,parseInt($('reps').value)||10);
    const gap=parseFloat($('gap').value)*1000;
    if(rep>=reps){ rep=0; idx++; }
    if(idx>=chunks.length){ finish(); return; }
    timer=setTimeout(playChunk,Math.max(gap,150));
  });
}
function finish(){ playing=false; idx=0; rep=0; releaseWake(); updateUI(); $('now').textContent='✅ انتهت الصفحة'; }
async function getWake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
function startPlay(){
  if(!synth){ alert('المتصفح لا يدعم القراءة الصوتية'); return; }
  if(!chunks.length) buildChunks();
  if(!chunks.length){ alert('لا يوجد نص للقراءة'); return; }
  playing=true; getWake(); renderChunks(); playChunk();
}
function stopAll(){
  playing=false; token++; clearTimeout(timer);
  if(synth) synth.cancel(); releaseWake(); updateUI();
}
$('btnPlay').onclick=()=>{ if(playing){ stopAll(); } else startPlay(); };
$('btnStop').onclick=()=>{ stopAll(); idx=0; rep=0; updateUI(); renderChunks(); };
$('btnNext').onclick=()=>{ const was=playing; stopAll(); if(idx<chunks.length-1) idx++; rep=0; renderChunks(); updateUI(); if(was) startPlay(); };
$('btnPrev').onclick=()=>{ const was=playing; stopAll(); if(idx>0) idx--; rep=0; renderChunks(); updateUI(); if(was) startPlay(); };
document.addEventListener('visibilitychange',()=>{ if(playing&&document.visibilityState==='visible') getWake(); });

renderSaved();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
